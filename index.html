<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ef">
  <title>Daymark | To-do</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f5ef;
      --surface: #fff;
      --ink: #20291f;
      --muted: #70796e;
      --line: #e3e8df;
      --green: #46734f;
      --green-dark: #315b3a;
      --lime: #d5ee8e;
      --coral: #c45d48;
      --shadow: 0 18px 55px rgb(39 58 38 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#dce4d7 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page-shell {
      width: min(100% - 40px, 1080px);
      min-height: 100vh;
      margin-inline: auto;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      align-items: start;
      gap: clamp(36px, 8vw, 112px);
      padding-block: 48px 72px;
    }

    .sidebar { padding-top: 5px; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      letter-spacing: 0;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 9px;
      background: var(--green);
      color: white;
      font-family: Georgia, serif;
      font-size: 19px;
      line-height: 1;
    }

    .sidebar-note {
      max-width: 175px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .sidebar-rule {
      width: 34px;
      height: 2px;
      margin-top: 28px;
      background: var(--lime);
    }

    main { width: 100%; max-width: 650px; }

    .date-label {
      margin: 4px 0 13px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 5vw, 54px);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.08;
    }

    .intro {
      margin: 12px 0 30px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .task-form {
      display: flex;
      gap: 9px;
      padding: 7px;
      border: 1px solid #dce3d8;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgb(39 58 38 / 4%);
    }

    .task-input {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
    }

    .task-input::placeholder { color: #929a90; }
    .task-input:focus-visible { outline: 2px solid #a5c790; outline-offset: 1px; border-radius: 3px; }

    .add-button {
      flex: 0 0 auto;
      min-width: 86px;
      padding: 10px 16px;
      border: 0;
      border-radius: 5px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background 140ms ease, transform 140ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: scale(0.98); }

    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 29px;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);
    }

    .filters {
      display: flex;
      gap: 3px;
      padding: 3px;
      border-radius: 6px;
      background: #e9ede6;
    }

    .filter-button {
      padding: 7px 11px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .filter-button[aria-pressed="true"] {
      background: white;
      color: var(--ink);
      box-shadow: 0 1px 3px rgb(32 41 31 / 10%);
    }

    .clear-button {
      padding: 7px 0 7px 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
    }

    .clear-button:hover:not(:disabled) { color: var(--coral); }
    .clear-button:disabled { cursor: default; opacity: 0.45; }

    .task-count {
      min-height: 18px;
      margin: 13px 0 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 32px;
      align-items: center;
      gap: 12px;
      min-height: 59px;
      border-bottom: 1px solid var(--line);
      animation: arrive 180ms ease-out both;
    }

    .task-toggle {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      padding: 0;
      border: 1.5px solid #b7c4b2;
      border-radius: 50%;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .task-toggle:hover { border-color: var(--green); }
    .task-toggle[aria-pressed="true"] { border-color: var(--green); background: var(--green); }
    .task-toggle[aria-pressed="true"]::after { content: "✓"; font-size: 13px; line-height: 1; }

    .task-title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.45;
    }

    .task-row.is-complete .task-title { color: #90988e; text-decoration: line-through; }

    .delete-button {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #8b9389;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      opacity: 0;
      transition: opacity 120ms ease, background 120ms ease, color 120ms ease;
    }

    .task-row:hover .delete-button,
    .delete-button:focus-visible { opacity: 1; }

    .delete-button:hover { background: #f8e9e5; color: var(--coral); }

    .empty-state {
      padding: 45px 16px 38px;
      color: var(--muted);
      text-align: center;
    }

    .empty-mark {
      display: grid;
      width: 42px;
      height: 42px;
      margin: 0 auto 13px;
      place-items: center;
      border-radius: 50%;
      background: #e5eddf;
      color: var(--green);
      font-family: Georgia, serif;
      font-size: 21px;
    }

    .empty-title { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; }
    .empty-copy { margin: 6px 0 0; font-size: 12px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    @media (max-width: 680px) {
      .page-shell {
        width: min(100% - 36px, 520px);
        grid-template-columns: minmax(0, 1fr);
        gap: 35px;
        padding-block: 25px 48px;
      }

      .sidebar { display: flex; align-items: center; justify-content: space-between; }
      .sidebar-note, .sidebar-rule { display: none; }
      .date-label { margin-top: 0; }
      .intro { margin-bottom: 24px; }
      .delete-button { opacity: 1; }
    }

    @media (max-width: 390px) {
      .page-shell { width: calc(100% - 28px); }
      .list-toolbar { align-items: flex-start; flex-direction: column; gap: 8px; }
      .clear-button { padding-left: 3px; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar" aria-label="About Daymark">
      <a class="brand" href="#" aria-label="Daymark home">
        <span class="brand-mark" aria-hidden="true">d</span>
        <span>daymark</span>
      </a>
      <p class="sidebar-note">A little space to gather your thoughts and make today count.</p>
      <div class="sidebar-rule" aria-hidden="true"></div>
    </aside>

    <main>
      <p class="date-label" id="today-date"></p>
      <h1>Your day,<br>in focus.</h1>
      <p class="intro">One thing at a time. What would you like to get done?</p>

      <form class="task-form" id="task-form">
        <label class="visually-hidden" for="task-input">Add a task</label>
        <input class="task-input" id="task-input" name="task" type="text" maxlength="240" placeholder="Write down a task..." autocomplete="off" required>
        <button class="add-button" type="submit">Add task</button>
      </form>

      <section aria-label="Your tasks">
        <div class="list-toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </div>
        <p class="task-count" id="task-count" aria-live="polite"></p>
        <ul class="task-list" id="task-list" aria-label="Task list"></ul>
        <div class="empty-state" id="empty-state" hidden>
          <span class="empty-mark" aria-hidden="true">✓</span>
          <p class="empty-title" id="empty-title">Nothing on your list yet</p>
          <p class="empty-copy" id="empty-copy">Add a task above to get started.</p>
        </div>
      </section>
      <p class="visually-hidden" id="save-status" role="status" aria-live="polite"></p>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "daymark.tasks.v1";
    const taskForm = document.querySelector("#task-form");
    const taskInput = document.querySelector("#task-input");
    const taskList = document.querySelector("#task-list");
    const taskCount = document.querySelector("#task-count");
    const emptyState = document.querySelector("#empty-state");
    const emptyTitle = document.querySelector("#empty-title");
    const emptyCopy = document.querySelector("#empty-copy");
    const clearCompletedButton = document.querySelector("#clear-completed");
    const saveStatus = document.querySelector("#save-status");
    const filters = document.querySelectorAll("[data-filter]");
    let activeFilter = "all";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(saved)) return [];
        return saved.filter(task =>
          task && typeof task.id === "string" &&
          typeof task.title === "string" && typeof task.completed === "boolean"
        );
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        saveStatus.textContent = "Changes saved on this device.";
      } catch {
        saveStatus.textContent = "Could not save changes in this browser.";
      }
    }

    function renderTasks() {
      const visibleTasks = tasks.filter(task => {
        if (activeFilter === "active") return !task.completed;
        if (activeFilter === "completed") return task.completed;
        return true;
      });
      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
      clearCompletedButton.disabled = !tasks.some(task => task.completed);
      taskList.replaceChildren();

      for (const task of visibleTasks) {
        const row = document.createElement("li");
        row.className = `task-row${task.completed ? " is-complete" : ""}`;

        const toggle = document.createElement("button");
        toggle.className = "task-toggle";
        toggle.type = "button";
        toggle.setAttribute("aria-pressed", String(task.completed));
        toggle.setAttribute("aria-label", `${task.completed ? "Mark as active" : "Complete"}: ${task.title}`);
        toggle.addEventListener("click", () => {
          task.completed = !task.completed;
          saveTasks();
          renderTasks();
        });

        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = task.title;

        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Delete: ${task.title}`);
        remove.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        row.append(toggle, title, remove);
        taskList.append(row);
      }

      emptyState.hidden = visibleTasks.length > 0;
      if (visibleTasks.length === 0 && tasks.length > 0) {
        emptyTitle.textContent = activeFilter === "active" ? "All caught up" : "No completed tasks yet";
        emptyCopy.textContent = activeFilter === "active" ? "Enjoy the breathing room." : "Finished tasks will show up here.";
      } else {
        emptyTitle.textContent = "Nothing on your list yet";
        emptyCopy.textContent = "Add a task above to get started.";
      }
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();
      const title = taskInput.value.trim();
      if (!title) return;
      tasks.unshift({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, title, completed: false });
      saveTasks();
      activeFilter = "all";
      filters.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));
      renderTasks();
      taskInput.value = "";
      taskInput.focus();
    });

    filters.forEach(button => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        filters.forEach(filter => filter.setAttribute("aria-pressed", String(filter === button)));
        renderTasks();
      });
    });

    clearCompletedButton.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    });

    document.querySelector("#today-date").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long", month: "long", day: "numeric"
    }).format(new Date());

    renderTasks();
  </script>
</body>
</html>
